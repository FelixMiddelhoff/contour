name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: electron:build:win
            artifact: dist/*.exe
          - os: macos-latest
            script: electron:build:mac
            artifact: dist/*.dmg
          - os: ubuntu-latest
            script: electron:build:linux
            artifact: |
              dist/*.AppImage
              dist/*.flatpak
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # electron-builder's flatpak target installs the runtime, SDK and
      # Electron base app itself, but needs flatpak-builder and a user-level
      # Flathub remote to pull them from
      - name: Install flatpak tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: contour-${{ matrix.os }}
          path: ${{ matrix.artifact }}

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
